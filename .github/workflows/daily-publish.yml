# Releases posts that were written ahead of time, on the date they are due.
#
# Why this exists: every attempt at "a model wakes up at 6am and writes today's
# posts" failed on credentials. The scheduled session had no repository
# attached, so it could not push, and it failed silently for days at a time.
#
# This job cannot fail that way. It runs no model and needs no API key. The
# posts are already written and committed, each carrying a future `date` in its
# front matter. All this does is render the ones whose date has arrived and
# push them. GITHUB_TOKEN is provided by Actions automatically, so there is
# nothing for anyone to manage or rotate.
#
# Writing ahead happens in a Claude session. Releasing happens here.

name: Daily publish

on:
  schedule:
    # 13:00 UTC is 06:00 in Phoenix. Arizona does not observe DST, so this
    # stays at 6am year round with no adjustment.
    - cron: "0 13 * * *"
    # The safety net. GitHub's scheduler is best effort: it ran this job four
    # and a half hours late on 2026-09-24 and skipped 2026-09-25 outright, so
    # two posts sat written and unpublished until someone noticed. A second
    # run at 21:00 UTC (14:00 Phoenix) catches a morning that never fired.
    #
    # Running twice is safe. The job renders only posts whose date has
    # arrived, and the commit step exits 0 when the tree is unchanged, so the
    # second run is a no-op on any day the first one worked. The `publish`
    # concurrency group queues the runs rather than overlapping them.
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/rickykhamis-daily-blog-automation-dovt88
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow for header images
        # The import check matters. `import PIL` succeeds even when the
        # compiled _imaging extension is missing, and header generation is
        # deliberately non-fatal, so a half-installed Pillow publishes posts
        # with no header image and only a warning in the log. That happened
        # on 2026-09-25 and cost 44 images. Fail here instead.
        run: |
          pip install --quiet Pillow
          python -c "from PIL import Image, ImageDraw, ImageFont; print('Pillow OK')"


      - name: Refresh the rate sheet
        # Feeds /cash-out-refinance-calculator/. The EPiQ sheet is the real
        # pricing and carries an APR beside every rate; the Freddie Mac survey
        # stays as a backstop for the day the sheet cannot be read. Neither can
        # fail this run: both exit 0 on an unreachable or unparseable source and
        # leave the previous file alone, and the page copes with having neither.
        # The selftests run first so a silently broken parser is caught here
        # rather than by publishing a wrong number.
        run: |
          python gen/update_rates.py --selftest
          python gen/update_pmms.py --selftest
          python gen/update_rates.py
          python gen/update_pmms.py

      - name: Screen every post for compliance
        run: python gen/compliance_check.py content/posts/*.md

      - name: Render posts that are due
        run: python gen/new_post.py --all-unpublished --due-only

      - name: Rebuild the topic hubs
        # The four cluster hubs link only posts that have actually rendered,
        # so they have to be rebuilt after the day's posts go out. Skipping
        # this does not break the site, it just leaves the hub a day stale.
        run: python gen/build_hubs.py

      - name: Verify site consistency
        run: python gen/new_post.py --check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content site
          if git diff --cached --quiet; then
            echo "Nothing due today. This is a normal, healthy no-op."
            exit 0
          fi
          git commit -m "Publish scheduled posts ($(TZ=America/Phoenix date +%Y-%m-%d))"
          git push origin HEAD:claude/rickykhamis-daily-blog-automation-dovt88
          echo "Pushed $(git rev-parse --short HEAD)"

      - name: Report how much runway is left
        run: |
          python - <<'PY'
          import glob, re, datetime, pathlib
          today = datetime.date.today()
          ahead = []
          for f in glob.glob("content/posts/*.md"):
              m = re.search(r"^date:\s*(\d{4}-\d{2}-\d{2})\s*$",
                            pathlib.Path(f).read_text(), re.M)
              if m:
                  d = datetime.date.fromisoformat(m.group(1))
                  if d > today:
                      ahead.append(d)
          import collections
          by_day = collections.Counter(ahead)
          if not ahead:
              print("::warning::No posts written ahead. The site will publish "
                    "nothing tomorrow. Ask Claude to write the next batch.")
          else:
              days = sorted(by_day)
              # The cadence is TWO posts per day. A batch dated one per day
              # silently halves output and looks like the scheduler failing,
              # which is exactly what happened over 2026-09-13 to 09-22.
              thin = [str(d) for d in days if by_day[d] < 2]
              print(f"{len(ahead)} post(s) queued across {len(days)} day(s), "
                    f"through {days[-1]}.")
              for d in days:
                  print(f"  {d}: {by_day[d]}")
              if thin:
                  print(f"::warning::Cadence is 2 posts/day. These days have "
                        f"fewer: {', '.join(thin)}")
          PY

# Temporary. Looks at epiqlending.com from a runner, because the machine the
# scrapers are written on cannot reach it. Answers two open questions in one
# run: does the corporate site publish rates (in particular a cash-out
# scenario, which the epiqrates sheet does not have), and which branch NMLS it
# shows, since epiqrates.com and rickykhamis.com currently disagree.
# Prints structure only, from pages that are already public.
name: Probe rates page

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch and describe
        run: |
          python - <<'PY'
          import re, urllib.request, html as H

          PATHS = [
              "https://www.epiqlending.com/",
              "https://www.epiqlending.com/rates",
              "https://www.epiqlending.com/rates/",
              "https://www.epiqlending.com/mortgage-rates",
              "https://www.epiqlending.com/todays-rates",
              "https://www.epiqlending.com/loan-programs/cash-out-refinance",
              "https://www.epiqlending.com/corporate/licensing",
          ]

          def get(url):
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Mozilla/5.0 (compatible; rickykhamis.com rate updater)",
                  "Accept": "text/html,application/xhtml+xml,*/*;q=0.8",
              })
              return urllib.request.urlopen(req, timeout=35)

          def visible(html):
              s = re.sub(r"(?is)<(script|style)[^>]*>.*?</\1>", " ", html)
              return H.unescape(re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", s))).strip()

          for url in PATHS:
              print("\n" + "=" * 70)
              print("URL", url)
              try:
                  r = get(url)
                  raw = r.read()
                  print("  STATUS", r.status, "FINAL", r.geturl(), "BYTES", len(raw))
              except Exception as e:
                  print("  FAILED:", type(e).__name__, getattr(e, "code", ""), str(e)[:120])
                  continue

              text = visible(raw.decode("utf-8", "replace"))
              print("  VISIBLE-CHARS", len(text))

              # Rate-shaped numbers: two or three decimals, mortgage range.
              pairs = re.findall(r"(\d{1,2}\.\d{2,3})\s*%", text)
              plausible = [p for p in pairs if 2.0 <= float(p) <= 20.0]
              print("  RATE-LIKE NUMBERS:", plausible[:25])
              print("  'APR' count:", len(re.findall(r"\bAPR\b", text, re.I)))

              for kw in ("cash-out", "cash out", "refinance", "Today's Rates", "rate sheet"):
                  hits = [m.start() for m in re.finditer(re.escape(kw), text, re.I)][:2]
                  for h in hits:
                      print(f"  kw[{kw}] ...{text[max(0,h-70):h+90]}...")

              for m in re.finditer(r"NMLS[^0-9]{0,20}(\d{4,8})", text, re.I):
                  a = max(0, m.start() - 70)
                  print("  NMLS>", text[a:m.end() + 40])

              if len(text) < 400:
                  print("  SHORT PAGE, full text:", text)
          PY

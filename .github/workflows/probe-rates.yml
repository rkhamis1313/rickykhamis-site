# Temporary. Looks at the EPiQ rates page from a runner, because the machine the
# scraper is written on cannot reach it, and a scraper written blind is a
# scraper that publishes the wrong number. Prints structure only, and the page
# it reads is already public. Delete once gen/update_rates.py is written.
name: Probe rates page

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch and describe
        run: |
          python - <<'PY'
          import re, json, urllib.request, html as H

          URL = "https://www.epiqrates.com/rates/rickykhamis"
          req = urllib.request.Request(URL, headers={
              "User-Agent": "Mozilla/5.0 (compatible; rickykhamis.com rate updater)",
              "Accept": "text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8",
          })
          try:
              with urllib.request.urlopen(req, timeout=40) as r:
                  raw = r.read()
                  print("STATUS", r.status)
                  print("FINAL-URL", r.geturl())
                  print("CTYPE", r.headers.get("Content-Type"))
                  print("BYTES", len(raw))
          except Exception as e:
              print("FETCH FAILED:", type(e).__name__, e)
              raise SystemExit(0)

          text = raw.decode("utf-8", "replace")

          # Is the content in the HTML, or drawn later by JavaScript?
          scripts = len(re.findall(r"<script", text, re.I))
          stripped = re.sub(r"(?is)<(script|style)[^>]*>.*?</\1>", " ", text)
          visible = H.unescape(re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", stripped))).strip()
          print("SCRIPT-TAGS", scripts, "VISIBLE-TEXT-CHARS", len(visible))

          print("\n--- FIRST 2500 CHARS OF VISIBLE TEXT ---")
          print(visible[:2500])

          print("\n--- EVERY PERCENTAGE WITH CONTEXT ---")
          for m in list(re.finditer(r"\d{1,2}\.\d{2,3}\s*%", visible))[:60]:
              a = max(0, m.start() - 90)
              print(" *", visible[a:m.end() + 40].replace("\n", " "))

          print("\n--- LOOKS LIKE APR? ---")
          print("count of 'APR':", len(re.findall(r"\bAPR\b", visible, re.I)))

          print("\n--- EMBEDDED JSON / STATE BLOBS ---")
          for pat in (r"__NEXT_DATA__", r"__NUXT__", r"window\.__", r"application/json"):
              print(pat, "->", len(re.findall(pat, text)))
          for m in list(re.finditer(r'<script[^>]*type="application/json"[^>]*>(.*?)</script>', text, re.S))[:3]:
              blob = m.group(1).strip()
              print("JSON BLOB", len(blob), "chars:", blob[:700])

          print("\n--- API-ISH URLS REFERENCED ---")
          urls = set(re.findall(r'https?://[^\s"\'<>]{0,120}(?:api|rate|pricing|quote)[^\s"\'<>]{0,80}', text, re.I))
          for u in list(urls)[:25]:
              print(" *", u)

          print("\n--- CANDIDATE PRODUCT LABELS ---")
          for kw in ("cash", "refin", "purchase", "30", "15", "FHA", "VA", "Jumbo", "Conventional"):
              hits = [m.start() for m in re.finditer(kw, visible, re.I)][:4]
              if hits:
                  print(" ", kw, "->", [visible[max(0, h - 40):h + 60].replace("\n", " ") for h in hits[:2]])
          PY

name: Verify live site

# rickykhamis.com is unreachable from the authoring sandbox, so post-deploy
# verification runs here. Asserts the redirect rules actually took effect and
# that the pages the mirror had to recover are really being served.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Verify live URLs
        run: |
          set -u
          BASE="https://rickykhamis.com"
          fail=0

          # expect_status <path> <code>
          expect_status() {
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$BASE$1")
            if [ "$code" = "$2" ]; then
              echo "  ok    $1 -> $code"
            else
              echo "  FAIL  $1 -> $code (expected $2)"
              fail=1
            fi
          }

          # expect_redirect <path> <expected Location suffix>
          expect_redirect() {
            out=$(curl -sS -o /dev/null -D - --max-time 30 "$BASE$1" \
                  | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}' | head -1)
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$BASE$1")
            case "$out" in
              *"$2") echo "  ok    $1 -> $code $out" ;;
              *)     echo "  FAIL  $1 -> $code $out (expected Location ending $2)"; fail=1 ;;
            esac
          }

          echo "== the two the handoff called out =="
          expect_redirect /company/ /about/
          expect_status  /thank-you/ 200

          echo "== other recovered files =="
          expect_status /feed.xml 200
          expect_status /assets/images/epiq-logo.png 200
          expect_status /assets/images/ricky-khamis.jpg 200

          echo "== a sample of the other redirect rules =="
          expect_redirect /todays-rates/ /rates/
          expect_redirect /aio/ /all-in-one-loan/
          expect_redirect /loan-options/ /loan-programs/
          expect_redirect /blog/page/1/ /blog/
          expect_redirect /discipline-is-the-difference/ /blog/discipline-is-the-difference/

          echo "== core pages =="
          expect_status / 200
          expect_status /blog/ 200
          expect_status /blog/page/5/ 200
          expect_status /about/ 200
          expect_status /sitemap.xml 200

          echo "== the retired city pages really 301 to their program page =="
          expect_redirect /fha-loans-mesa/ /loan-programs/fha-loans/
          expect_redirect /va-loans-gilbert/ /loan-programs/va-loans/
          expect_redirect /conventional-loans-tempe/ /loan-programs/conventional-loans/
          expect_redirect /jumbo-loans-paradise-valley/ /loan-programs/jumbo-loans/
          expect_redirect /dscr-loans-scottsdale/ /dscr-investor-loans/
          expect_redirect /cash-out-refinance-scottsdale/ /loan-programs/mortgage-refinance/
          expect_status /cash-out-refinance-calculator/ 200

          echo "== the two generated posts =="
          expect_status /blog/best-first-time-buyer-lender-scottsdale/ 200
          expect_status /blog/best-first-time-buyer-lender-gilbert/ 200

          echo
          if [ "$fail" = "0" ]; then
            echo "All checks passed."
          else
            echo "One or more checks failed."
            exit 1
          fi

      - name: Every URL in the sitemap is really being served
        run: |
          set -u
          # The hardcoded list above ages badly: it verifies the pages that
          # mattered the day it was written and says nothing about the pages
          # published since. The sitemap is the site's own claim about what
          # exists, so check the claim.
          python3 - <<'EOF' > /tmp/urls.txt
          import re, io
          s = io.open('site/sitemap.xml', encoding='utf-8').read()
          for u in re.findall(r'<loc>([^<]+)</loc>', s):
              print(u)
          EOF

          total=$(wc -l < /tmp/urls.txt)
          echo "sitemap lists $total URLs"
          fail=0
          while read -r url; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$url")
            if [ "$code" != "200" ]; then
              echo "  FAIL  $url -> $code"
              fail=1
            fi
          done < /tmp/urls.txt

          if [ "$fail" = "0" ]; then
            echo "All $total sitemap URLs return 200."
          else
            echo "One or more sitemap URLs are not being served."
            exit 1
          fi
